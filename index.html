<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Typing Censor Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
    
    <div class="container">
        <h1>🔒 Live Typing Censor Tool</h1>
        <p class="subtitle">Type freely — Censor words as you type</p>

        <div class="word-list">
            <h3>📝 Censored Words List:</h3>
            <p id="wordListDisplay"></p>
            <button class="reset-words-btn" onclick="resetWordList()">Reset to Default</button>
        </div>

        <div class="input-group">
            <input type="text" id="newWordInput" placeholder="Add a new word to censor...">
            <button class="add-btn" onclick="addNewWord()">Add Word</button>
        </div>

        <div class="editor-wrapper">
            <textarea 
                id="textInput" 
                placeholder="Start typing here... Censored words will be blacked out in real-time."
            ></textarea>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-number" id="wordCount">0</div>
                <div class="stat-label">Words</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="charCount">0</div>
                <div class="stat-label">Characters</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="censorCount">0</div>
                <div class="stat-label">Words Censored</div>
            </div>
        </div>

        <div class="controls">
            <button class="clear-btn" onclick="clearText()">Clear</button>
            <button class="copy-btn" onclick="copyText()">Copy</button>
            <button class="download-btn" onclick="downloadText()">Download .txt</button>
        </div>

        <footer>
            Created by <a href="https://github.com/JoeMighty" target="_blank">Jobin Bennykutty</a>
        </footer>
    </div>

    <div class="notification" id="notification">Text copied to clipboard!</div>

    <script src="script.js"></script>
</body>
</html>
