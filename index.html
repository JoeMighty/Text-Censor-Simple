<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Typing Censor Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙 Dark Mode</button>
    
    <main class="container">
        <h1>🔒 Live Typing Censor Tool</h1>
        <p class="subtitle">Type freely — Censored words are replaced in real-time.</p>

        <section class="word-list" aria-labelledby="list-heading">
            <h3 id="list-heading">📝 Censored Words List:</h3>
            <div id="wordListDisplay" class="tags-container"></div>
            <button class="reset-words-btn" onclick="resetWordList()">Reset to Default</button>
        </section>

        <div class="input-group">
            <div class="field-stack">
                <input type="text" id="newWordInput" placeholder="Add word...">
            </div>
            
            <div class="field-stack">
                <select id="censorStyle" class="style-select" onchange="updateCensorStyle()">
                    <option value="█">Solid Block (█)</option>
                    <option value="*">Asterisks (*)</option>
                    <option value="x">Crosses (x)</option>
                    <option value="?">Question Marks (?)</option>
                    <option value="custom">Custom Character...</option>
                </select>
            </div>

            <div class="field-stack" id="customCharWrapper" style="display: none;">
                <input type="text" id="customCharInput" maxlength="1" placeholder="Char" value="$">
            </div>
            
            <button class="add-btn" onclick="addNewWord()">Add</button>
        </div>

        <div class="editor-wrapper">
            <textarea 
                id="textInput" 
                placeholder="Start typing here..."
            ></textarea>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-number" id="wordCount">0</div>
                <div class="stat-label">Words</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="charCount">0</div>
                <div class="stat-label">Characters</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="censorCount">0</div>
                <div class="stat-label">Censored</div>
            </div>
        </div>

        <div class="controls">
            <button class="clear-btn" onclick="clearText()">Clear</button>
            <button class="copy-btn" onclick="copyText()">Copy Text</button>
            <button class="download-btn" onclick="downloadText()">Download .txt</button>
        </div>

        <footer>
            Created by <a href="https://github.com/JoeMighty" target="_blank" rel="noopener">Jobin Bennykutty</a>
        </footer>
    </main>

    <div class="notification" id="notification">Text copied to clipboard!</div>

    <script src="script.js"></script>
</body>
</html>
